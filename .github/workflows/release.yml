name: Release

# Publishes a GitHub Release with installers for every platform whenever a
# version tag (e.g. v0.4.0) is pushed.
#
# Usage:
#   1. Bump the version in package.json, src-tauri/tauri.conf.json and
#      src-tauri/Cargo.toml (keep them in sync).
#   2. Commit, then: git tag v0.4.0 && git push origin v0.4.0
#   3. This workflow builds every target and creates a *draft* release with the
#      installers attached. Review it on the Releases page, then hit "Publish".

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS and Linux are temporarily disabled: on Tauri 1.x CI the webview
          # deps (wry/webkit2gtk) fail to compile on Linux and macOS bundling
          # produces no artifacts. Re-enable these once those builds are fixed.
          # - platform: 'macos-latest' # Apple Silicon (M-series)
          #   args: '--target aarch64-apple-darwin'
          # - platform: 'macos-latest' # Intel
          #   args: '--target x86_64-apple-darwin'
          # - platform: 'ubuntu-22.04'
          #   args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CleanType ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your platform from the assets below.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
